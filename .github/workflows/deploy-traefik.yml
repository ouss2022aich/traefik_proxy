name: Deploy Traefik

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: traefik-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Check loaded SSH key
        run: |
          echo "Loaded SSH keys:"
          ssh-add -l

      - name: Test SSH connectivity
        run: |
          echo "Testing SSH port 22..."
          nc -vz -w 10 "${{ secrets.SSH_HOST }}" 22

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh

          ssh-keyscan \
            -T 10 \
            -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      - name: Test SSH authentication
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH connection successful'"

      - name: Sync repository
        run: |
          rsync -az --delete \
            -e "ssh -o IdentitiesOnly=yes" \
            --exclude ".git" \
            --exclude ".github" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Deploy Traefik
        run: |
          ssh \
            -o IdentitiesOnly=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" '
              set -eu

              cd "${{ secrets.DEPLOY_PATH }}"

              docker network inspect shared-proxy >/dev/null 2>&1 \
                || docker network create shared-proxy

              mkdir -p data

              [ -f data/acme.json ] \
                || touch data/acme.json

              chmod 600 data/acme.json

              docker compose config >/dev/null

              docker compose pull

              docker compose up -d

              echo "Traefik containers:"
              docker ps --filter "name=traefik"
            '